# SonarQube/SonarCloud Configuration
# Replace neolisto_simple_python_parser and neolisto with your actual values

sonar.projectKey=neolisto_simple_python_parser
sonar.organization=neolisto

# Project information
sonar.projectName=Simple Python Parser
sonar.projectVersion=1.0

# Source code location
sonar.sources=.

# Exclusions
sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/venv/**,**/.venv/**,**/node_modules/**,**/*.md

# Python specific settings
sonar.python.version=3.8,3.9,3.10,3.11

# Coverage report path (if you run tests with coverage)
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8

