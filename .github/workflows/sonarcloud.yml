name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better relevancy of analysis
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov
      
      - name: Run tests with coverage
        run: |
          # Run tests with coverage if you have tests
          # If you don't have tests yet, comment out or remove this step
          # pytest --cov=. --cov-report=xml --cov-report=term
          echo "Skipping tests - add your test command here"
        continue-on-error: true
      
      - name: SonarCloud Scan
        id: sonarcloud
        # Pinned to specific commit SHA for security (v6.0.0)
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: Wait for Quality Gate Result
        id: quality_gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: false  # This ensures the workflow fails if quality gate fails
      
      - name: Quality Gate Status Check
        if: steps.quality_gate.outputs.quality-gate-status == 'FAILED'
        run: |
          echo "::error::Quality Gate failed! The code does not meet the required quality standards."
          echo "Quality Gate Status: ${{ steps.quality_gate.outputs.quality-gate-status }}"
          exit 1
      
      - name: Send email notification on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ SonarCloud Analysis Succeeded - ${{ github.repository }}"
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions
          body: |
            SonarCloud analysis completed successfully!
            Quality Gate: ✅ PASSED
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Workflow: ${{ github.workflow }}
            Quality Gate Status: ${{ steps.quality_gate.outputs.quality-gate-status }}
            
            View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            View SonarCloud: https://sonarcloud.io/dashboard?id=neolisto_simple_python_parser
      
      - name: Send email notification on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ SonarCloud Analysis Failed - ${{ github.repository }}"
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions
          body: |
            SonarCloud analysis or Quality Gate check failed!
            Quality Gate: ❌ ${{ steps.quality_gate.outputs.quality-gate-status || 'UNKNOWN' }}
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Workflow: ${{ github.workflow }}
            
            Please check the workflow run for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            View SonarCloud for detailed analysis:
            https://sonarcloud.io/dashboard?id=neolisto_simple_python_parser

