# This workflow will build a Python app and deploy it to an Azure Functions App on Linux when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure Functions app.
# For instructions see https://learn.microsoft.com/en-us/azure/azure-functions/create-first-function-vs-code-python?pivots=python-mode-configuration
#
# To configure this workflow:
# 1. Set up the following secrets in your repository:
#   - AZURE_FUNCTIONAPP_PUBLISH_PROFILE
# 2. Change env variables for your configuration.
#
# For more information on:
#   - GitHub Actions for Azure: https://github.com/Azure/Actions
#   - Azure Functions Action: https://github.com/Azure/functions-action
#   - Publish Profile: https://github.com/Azure/functions-action#using-publish-profile-as-deployment-credential-recommended
#   - Azure Service Principal for RBAC: https://github.com/Azure/functions-action#using-azure-service-principal-for-rbac-as-deployment-credential
#
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples/tree/master/FunctionApp

name: Create ZIP and Deploy Python project to Azure Function App

on:
  push:
    branches: ["main", "dev"]
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0

env:
  PYTHON_VERSION: '3.10'                     # set this to the python version to use (e.g. '3.6', '3.7', '3.8')
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write  # Required to create GitHub releases
      packages: write  # Required to publish to GitHub Packages
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }} Environment
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 'Prepare ZIP file for deployment'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install --target=".python_packages/lib/site-packages" -r requirements.txt
        zip -r function_app_${{ github.ref_name }}.zip \
            function_app.py \
            function.json \
            host.json \
            requirements.txt \
            .python_packages/lib/site-packages/*

    - name: 'Deploy ZIP file to Azure Function App'
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}  # Only deploy on branch pushes, not tags
      shell: bash
      run: |
        az login --service-principal \
          --username ${{ vars.AZURE_APP_ID }} \
          --password ${{ secrets.AZURE_APP_SECRET }} \
          --tenant ${{ vars.AZURE_TENANT_ID }}
        az functionapp deployment source config-zip --build-remote true \
        -g ${{ vars.AZURE_FUNC_APP_RG}} \
        -n ${{ vars.AZURE_FUNC_APP_NAME}} \
        --src function_app_${{ github.ref_name }}.zip

    - name: 'Upload artifact for deployment'
      uses: actions/upload-artifact@v4
      with:
        name: function-app-package-${{ github.sha }}
        path: function_app_${{ github.ref_name }}.zip
        retention-days: 90
    
    - name: 'Setup Node.js for package publishing'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@${{ github.repository_owner }}'
    
    - name: 'Create and publish npm package'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Create package directory
        mkdir -p package-temp
        cp function_app_${{ github.ref_name }}.zip package-temp/
        cd package-temp
        
        # Generate package.json
        VERSION="1.0.$(date +%Y%m%d%H%M%S)"
        cat > package.json <<EOF
        {
          "name": "@${{ github.repository_owner }}/simple-python-parser-function",
          "version": "${VERSION}",
          "description": "Azure Function App package for Simple Python Parser",
          "main": "function_app_${{ github.ref_name }}.zip",
          "repository": {
            "type": "git",
            "url": "https://github.com/${{ github.repository }}.git"
          },
          "author": "${{ github.actor }}",
          "license": "MIT"
        }
        EOF
        
        # Publish to GitHub Packages
        npm publish
        
        echo "📦 Package published: @${{ github.repository_owner }}/simple-python-parser-function@${VERSION}"
        echo "View at: https://github.com/${{ github.repository }}/packages"
    
    - name: 'Create GitHub Release with ZIP'
      if: startsWith(github.ref, 'refs/tags/')  # Only run when a tag is pushed
      uses: softprops/action-gh-release@v1
      with:
        files: function_app_${{ github.ref_name }}.zip
        body: |
          ## Azure Function App Package - ${{ github.ref_name }}
          
          📦 **Package:** `function_app_${{ github.ref_name }}.zip`
          🐍 **Python Version:** ${{ env.PYTHON_VERSION }}
          📅 **Build Date:** ${{ github.event.head_commit.timestamp }}
          🔖 **Commit:** ${{ github.sha }}
          
          ### 📥 Download Options
          
          **Option 1: Direct ZIP Download (Recommended)**
          - Download the attached `function_app_${{ github.ref_name }}.zip` file below
          
          **Option 2: npm Package**
          ```bash
          npm install @${{ github.repository_owner }}/simple-python-parser-function
          ```
          
          ### 🚀 Deployment
          
          Deploy to Azure Functions using:
          ```bash
          az functionapp deployment source config-zip \
            -g <resource-group> \
            -n <function-app-name> \
            --src function_app_${{ github.ref_name }}.zip
          ```
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}